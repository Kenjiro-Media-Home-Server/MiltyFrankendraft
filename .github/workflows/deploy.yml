# Push to main -> the test suites -> image ghcr.io/kenjiro-media-home-server/miltyfrankendraft:sha-<commit>.
# The homeserver picks it up within ~2 minutes and serves it under /franken/.
# Pull requests are tested by test-application.yml itself; they never build or publish.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kenjiro-media-home-server/miltyfrankendraft

jobs:
  test:
    uses: ./.github/workflows/test-application.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=kenjiro-media-home-server
          cache-from: type=gha
          cache-to: type=gha,mode=max
