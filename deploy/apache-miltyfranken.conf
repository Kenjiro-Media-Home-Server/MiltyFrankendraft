# Franken / Milty draft app, served under https://<host>/franken/
#
# The app runs in Docker bound to 127.0.0.1:8091 and is deliberately not reachable from outside
# the machine. Apache terminates TLS and reverse-proxies to it.
#
# ProxyPass strips the /franken prefix on the way through, so the application's own router sees
# "/", "/d/{id}" and "/api/..." exactly as it expects, while the URL setting in its .env makes
# every link and asset it emits absolute under /franken/.
#
# This lives in conf-available rather than being edited into the site's vhost so that certbot's
# periodic vhost rewrites cannot silently drop it. Being server-scoped it applies to every vhost,
# which is what we want: the :80 vhost redirects to HTTPS, and the :443 vhost serves it.
#
# Install:
#   sudo cp deploy/apache-miltyfranken.conf /etc/apache2/conf-available/miltyfranken.conf
#   sudo a2enconf miltyfranken
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<IfModule mod_proxy.c>
    # Without this, /franken (no trailing slash) makes the browser resolve the app's relative
    # redirects — "d/{id}" after generating a draft — against / instead of /franken/.
    RedirectMatch 301 ^/franken$ /franken/

    ProxyPreserveHost On
    ProxyPass        /franken/ http://127.0.0.1:8091/
    ProxyPassReverse /franken/ http://127.0.0.1:8091/
</IfModule>
